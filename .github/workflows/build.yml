          @Composable
          private fun NetworkStreamModalSheet(
              streamHistory: List<NetworkStreamHistoryEntity>,
              onLaunchStream: (String, String, String, String, Map<String, String>) -> Unit,
              onDeleteHistory: (NetworkStreamHistoryEntity) -> Unit,
              onDismiss: () -> Unit
          ) {
              var streamUrl by remember { mutableStateOf("") }
              var streamTitle by remember { mutableStateOf("") }
              var showAdvancedHeaders by remember { mutableStateOf(false) }
              var userAgent by remember { mutableStateOf("") }
              var referer by remember { mutableStateOf("") }
              var rawCustomHeaders by remember { mutableStateOf("") }

              ModalBottomSheet(onDismissRequest = onDismiss) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 20.dp, vertical = 8.dp)
                          .navigationBarsPadding(),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Icon(Icons.Default.CloudQueue, contentDescription = null, tint = MaterialTheme.colorScheme.primary)
                          Spacer(Modifier.width(10.dp))
                          Column {
                              Text("Network Stream Engine", style = MaterialTheme.typography.titleLarge)
                              Text(
                                  "Direct HTTP/HTTPS • HLS (.m3u8) • DASH (.mpd) • RTSP • Custom Headers",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                      }

                      OutlinedTextField(
                          value = streamUrl,
                          onValueChange = { streamUrl = it },
                          label = { Text("Stream URL (https://, .m3u8, .mpd, .mkv, rtsp://)") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )

                      OutlinedTextField(
                          value = streamTitle,
                          onValueChange = { streamTitle = it },
                          label = { Text("Optional Display Title") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )

                      // Quick Verified Test Streams Row
                      Text(
                          "Instant Reference Test Streams:",
                          style = MaterialTheme.typography.labelMedium,
                          color = MaterialTheme.colorScheme.primary
                      )
                      LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          val samples = listOf(
                              "Big Buck Bunny (HLS .m3u8)" to "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
                              "Tears of Steel 4K (MP4)" to "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
                              "Sintel (HLS)" to "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8"
                          )
                          items(samples) { (name, sampleUrl) ->
                              AssistChip(
                                  onClick = {
                                      streamTitle = name
                                      streamUrl = sampleUrl
                                  },
                                  label = { Text(name, fontSize = 11.sp) },
                                  leadingIcon = { Icon(Icons.Default.Bolt, contentDescription = null, modifier = Modifier.size(16.dp)) }
                              )
                          }
                      }

                      // Collapsible Custom Headers & User-Agent Presets
                      TextButton(
                          onClick = { showAdvancedHeaders = !showAdvancedHeaders },
                          modifier = Modifier.align(Alignment.Start)
                      ) {
                          Icon(
                              if (showAdvancedHeaders) Icons.Default.ExpandLess else Icons.Default.ExpandMore,
                              contentDescription = null
                          )
                          Spacer(Modifier.width(6.dp))
                          Text("Custom User-Agent, Referer & HTTP Headers")
                      }

                      AnimatedVisibility(visible = showAdvancedHeaders) {
                          Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  val uaPresets = listOf(
                                      "Chrome" to "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
                                      "VLC" to "VLC/3.0.20 LibVLC/3.0.20",
                                      "Safari" to "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 Version/17.0 Safari/605.1.15"
                                  )
                                  uaPresets.forEach { (label, preset) ->
                                      FilterChip(
                                          selected = userAgent == preset,
                                          onClick = { userAgent = preset },
                                          label = { Text("UA: $label", fontSize = 11.sp) }
                                      )
                                  }
                              }
                              OutlinedTextField(
                                  value = userAgent,
                                  onValueChange = { userAgent = it },
                                  label = { Text("Custom User-Agent") },
                                  singleLine = true,
                                  modifier = Modifier.fillMaxWidth()
                              )
                              OutlinedTextField(
                                  value = referer,
                                  onValueChange = { referer = it },
                                  label = { Text("Custom Referer URL") },
                                  singleLine = true,
                                  modifier = Modifier.fillMaxWidth()
                              )
                              OutlinedTextField(
                                  value = rawCustomHeaders,
                                  onValueChange = { rawCustomHeaders = it },
                                  label = { Text("Arbitrary HTTP Headers (One Key: Value per line)") },
                                  placeholder = { Text("Authorization: Bearer token\nCookie: session=xyz") },
                                  minLines = 2,
                                  maxLines = 4,
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      }

                      Button(
                          onClick = {
                              if (streamUrl.isNotBlank()) {
                                  val parsedHeaders = rawCustomHeaders.lines()
                                      .mapNotNull { line ->
                                          val idx = line.indexOf(':')
                                          if (idx > 0) line.substring(0, idx).trim() to line.substring(idx + 1).trim()
                                          else null
                                      }.toMap()
                                  onLaunchStream(streamUrl, streamTitle, userAgent, referer, parsedHeaders)
                              }
                          },
                          enabled = streamUrl.isNotBlank(),
                          modifier = Modifier.fillMaxWidth().height(50.dp),
                          shape = RoundedCornerShape(14.dp)
                      ) {
                          Icon(Icons.Default.PlayCircleFilled, contentDescription = null)
                          Spacer(Modifier.width(8.dp))
                          Text("Launch Network Stream")
                      }

                      if (streamHistory.isNotEmpty()) {
                          HorizontalDivider(modifier = Modifier.padding(vertical = 4.dp))
                          Text("Saved Network Stream History", style = MaterialTheme.typography.titleSmall)
                          streamHistory.forEach { item ->
                              Surface(
                                  shape = RoundedCornerShape(12.dp),
                                  color = MaterialTheme.colorScheme.surfaceVariant,
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clickable {
                                          onLaunchStream(
                                              item.streamUrl,
                                              item.title,
                                              item.userAgent,
                                              item.referer,
                                              item.parsedHeaders()
                                          )
                                      }
                              ) {
                                  Row(
                                      modifier = Modifier.padding(12.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      SpecBadgeChip(text = item.protocolBadge, highlight = true)
                                      Spacer(Modifier.width(10.dp))
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text(item.title, style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.Bold, maxLines = 1)
                                          Text(item.streamUrl, style = MaterialTheme.typography.bodySmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      }
                                      IconButton(onClick = { onDeleteHistory(item) }) {
                                          Icon(Icons.Default.Close, contentDescription = "Delete", modifier = Modifier.size(18.dp))
                                      }
                                  }
                              }
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                  }
              }
          }

