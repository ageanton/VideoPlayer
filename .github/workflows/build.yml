          @Composable
          private fun FlagshipTimelineCanvas(
              currentPositionMs: Long,
              durationMs: Long,
              bufferedPercentage: Int,
              loopStartMs: Long?,
              loopEndMs: Long?,
              bookmarks: List<BookmarkEntity>,
              palette: VideoDynamicPalette,
              onScrub: (Long, Boolean, String) -> Unit,
              onDragLoopBracket: (Long, Long) -> Unit
          ) {
              val safeDuration = durationMs.coerceAtLeast(1L)
              val latestPos by rememberUpdatedState(currentPositionMs)
              val latestDur by rememberUpdatedState(safeDuration)
              val latestLoopA by rememberUpdatedState(loopStartMs)
              val latestLoopB by rememberUpdatedState(loopEndMs)

              Canvas(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(48.dp)
                      .pointerInput(Unit) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              val widthPx = size.width.toFloat().coerceAtLeast(1f)
                              val startA = latestLoopA
                              val endB = latestLoopB

                              // Check if user grabbed Loop Bracket A or B handle (within 28px)
                              val aX = if (startA != null) (startA.toFloat() / latestDur.toFloat()) * widthPx else -100f
                              val bX = if (endB != null) (endB.toFloat() / latestDur.toFloat()) * widthPx else -100f

                              val draggingBracket = when {
                                  startA != null && endB != null && abs(down.position.x - aX) < 32f -> 1 // Dragging A
                                  startA != null && endB != null && abs(down.position.x - bX) < 32f -> 2 // Dragging B
                                  else -> 0 // Scrubbing timeline
                              }

                              var scrubAnchorMs = ((down.position.x / widthPx).coerceIn(0f, 1f) * latestDur).roundToLong()
                              if (draggingBracket == 0) {
                                  onScrub(scrubAnchorMs, true, "1.0x Normal Scrub")
                              }

                              var currentTargetMs = scrubAnchorMs
                              do {
                                  val event = awaitPointerEvent()
                                  val change = event.changes.firstOrNull() ?: break
                                  if (change.pressed) {
                                      val dx = change.positionChange().x
                                      val verticalPullUpPx = (down.position.y - change.position.y).coerceAtLeast(0f)

                                      // 2D Fine Scrubbing Sensitivity based on upward finger distance
                                      val (sensitivity, label) = when {
                                          verticalPullUpPx > 140f -> 0.25f to "0.25x Ultra-Fine Scrub"
                                          verticalPullUpPx > 65f -> 0.50f to "0.50x Fine Scrub"
                                          else -> 1.0f to "1.0x Normal Scrub"
                                      }

                                      if (draggingBracket == 1 && startA != null && endB != null) {
                                          val frac = (change.position.x / widthPx).coerceIn(0f, 1f)
                                          val newA = (frac * latestDur).roundToLong().coerceAtMost(endB - 250L)
                                          onDragLoopBracket(newA, endB)
                                      } else if (draggingBracket == 2 && startA != null && endB != null) {
                                          val frac = (change.position.x / widthPx).coerceIn(0f, 1f)
                                          val newB = (frac * latestDur).roundToLong().coerceAtLeast(startA + 250L)
                                          onDragLoopBracket(startA, newB)
                                      } else {
                                          val deltaMs = ((dx / widthPx) * latestDur * sensitivity).roundToLong()
                                          currentTargetMs = (currentTargetMs + deltaMs).coerceIn(0L, latestDur)
                                          onScrub(currentTargetMs, true, label)
                                      }
                                      change.consume()
                                  }
                              } while (event.changes.any { it.pressed })

                              if (draggingBracket == 0) {
                                  // Enforce SeekParameters.EXACT on finger release
                                  onScrub(currentTargetMs, false, "Exact Frame Locked")
                              }
                          }
                      }
              ) {
                  val canvasW = size.width
                  val centerY = size.height / 2f
                  val trackHeight = 6.dp.toPx()

                  // 1. Unplayed Background Track
                  drawRoundRect(
                      color = Color.White.copy(alpha = 0.22f),
                      topLeft = Offset(0f, centerY - trackHeight / 2f),
                      size = Size(canvasW, trackHeight),
                      cornerRadius = CornerRadius(trackHeight / 2f)
                  )

                  // 2. Buffered Track
                  val bufWidth = (bufferedPercentage.coerceIn(0, 100) / 100f) * canvasW
                  drawRoundRect(
                      color = Color.White.copy(alpha = 0.38f),
                      topLeft = Offset(0f, centerY - trackHeight / 2f),
                      size = Size(bufWidth, trackHeight),
                      cornerRadius = CornerRadius(trackHeight / 2f)
                  )

                  // 3. Active Played Track
                  val playedFraction = (currentPositionMs.toFloat() / safeDuration.toFloat()).coerceIn(0f, 1f)
                  val playedWidth = playedFraction * canvasW
                  drawRoundRect(
                      color = palette.primaryAccent,
                      topLeft = Offset(0f, centerY - trackHeight / 2f),
                      size = Size(playedWidth, trackHeight),
                      cornerRadius = CornerRadius(trackHeight / 2f)
                  )

                  // 4. Precision A-B Loop Span & Bracket Handles ([ ... ])
                  if (loopStartMs != null) {
                      val aX = ((loopStartMs.toFloat() / safeDuration.toFloat()).coerceIn(0f, 1f)) * canvasW
                      val bX = if (loopEndMs != null) {
                          ((loopEndMs.toFloat() / safeDuration.toFloat()).coerceIn(0f, 1f)) * canvasW
                      } else aX

                      if (loopEndMs != null && bX > aX) {
                          drawRect(
                              color = palette.tertiaryLoopAccent.copy(alpha = 0.38f),
                              topLeft = Offset(aX, centerY - 11.dp.toPx()),
                              size = Size(bX - aX, 22.dp.toPx())
                          )
                      }

                      // Left '[' Bracket for Point A
                      val bracketH = 24.dp.toPx()
                      val bracketArm = 6.dp.toPx()
                      drawLine(
                          color = palette.tertiaryLoopAccent,
                          start = Offset(aX, centerY - bracketH / 2f),
                          end = Offset(aX, centerY + bracketH / 2f),
                          strokeWidth = 3.dp.toPx(),
                          cap = StrokeCap.Round
                      )
                      drawLine(
                          color = palette.tertiaryLoopAccent,
                          start = Offset(aX, centerY - bracketH / 2f),
                          end = Offset(aX + bracketArm, centerY - bracketH / 2f),
                          strokeWidth = 3.dp.toPx()
                      )
                      drawLine(
                          color = palette.tertiaryLoopAccent,
                          start = Offset(aX, centerY + bracketH / 2f),
                          end = Offset(aX + bracketArm, centerY + bracketH / 2f),
                          strokeWidth = 3.dp.toPx()
                      )

                      // Right ']' Bracket for Point B
                      if (loopEndMs != null) {
                          drawLine(
                              color = palette.tertiaryLoopAccent,
                              start = Offset(bX, centerY - bracketH / 2f),
                              end = Offset(bX, centerY + bracketH / 2f),
                              strokeWidth = 3.dp.toPx(),
                              cap = StrokeCap.Round
                          )
                          drawLine(
                              color = palette.tertiaryLoopAccent,
                              start = Offset(bX - bracketArm, centerY - bracketH / 2f),
                              end = Offset(bX, centerY - bracketH / 2f),
                              strokeWidth = 3.dp.toPx()
                          )
                          drawLine(
                              color = palette.tertiaryLoopAccent,
                              start = Offset(bX - bracketArm, centerY + bracketH / 2f),
                              end = Offset(bX, centerY + bracketH / 2f),
                              strokeWidth = 3.dp.toPx()
                          )
                      }
                  }

                  // 5. Diamond Bookmark Pin Markers
                  val diamondRadius = 5.dp.toPx()
                  for (bm in bookmarks) {
                      val bmX = ((bm.timestampMs.toFloat() / safeDuration.toFloat()).coerceIn(0f, 1f)) * canvasW
                      val bmY = centerY - 12.dp.toPx()
                      val diamondPath = Path().apply {
                          moveTo(bmX, bmY - diamondRadius)
                          lineTo(bmX + diamondRadius, bmY)
                          lineTo(bmX, bmY + diamondRadius)
                          lineTo(bmX - diamondRadius, bmY)
                          close()
                      }
                      drawPath(path = diamondPath, color = palette.tertiaryLoopAccent)
                  }

                  // 6. Glowing Playhead Thumb
                  drawCircle(
                      color = palette.primaryGlow,
                      radius = 12.dp.toPx(),
                      center = Offset(playedWidth, centerY)
                  )
                  drawCircle(
                      color = palette.primaryAccent,
                      radius = 7.dp.toPx(),
                      center = Offset(playedWidth, centerY)
                  )
                  drawCircle(
                      color = Color.White,
                      radius = 3.dp.toPx(),
                      center = Offset(playedWidth, centerY)
                  )
              }
          }

          @Composable
          private fun OsdActionPill(
              icon: ImageVector,
              label: String,
              isHighlighted: Boolean = false,
              highlightColor: Color? = null,
              palette: VideoDynamicPalette,
              onClick: () -> Unit
          ) {
              val activeAccent = highlightColor ?: palette.primaryAccent
              Surface(
                  shape = CircleShape,
                  color = if (isHighlighted) activeAccent.copy(alpha = 0.24f) else palette.osdSurface,
                  border = BorderStroke(
                      width = 1.dp,
                      color = if (isHighlighted) activeAccent else palette.specularBorder
                  ),
                  onClick = onClick,
                  modifier = Modifier.height(36.dp)
              ) {
                  Row(
                      modifier = Modifier.padding(horizontal = 12.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      Icon(
                          imageVector = icon,
                          contentDescription = label,
                          tint = if (isHighlighted) activeAccent else Color.White,
                          modifier = Modifier.size(16.dp)
                      )
                      Text(
                          text = label,
                          style = TabularNumeralStyle,
                          fontSize = 12.sp,
                          fontWeight = if (isHighlighted) FontWeight.Bold else FontWeight.Medium,
                          color = if (isHighlighted) activeAccent else Color.White
                      )
                  }
              }
          }

          // ============================================================================
          // 3. LAYER 6: VIEWPORT-SHRINKING RIGHT SIDE-SHEET (SUBTITLES, AUDIO, PINS, SPEED)
          // ============================================================================

          @Composable
          fun ViewportShrinkingSideSheet(
              activeTab: SideSheetTab,
              onSelectTab: (SideSheetTab) -> Unit,
              onClose: () -> Unit,
              palette: VideoDynamicPalette,
              prefs: AppPreferencesState,
              subtitleTracks: List<PlayerTrackOption>,
              subtitlesEnabled: Boolean,
              externalSubtitleLabel: String?,
              subtitleDelayMs: Long,
              subtitleSpeedFactor: Float,
              subtitleAnchorTimeMs: Long,
              audioTracks: List<PlayerTrackOption>,
              audioDelayMs: Long,
              volumeFraction: Float,
              bookmarks: List<BookmarkEntity>,
              savedLoops: List<SavedLoopEntity>,
              playbackSpeed: Float,
              onSelectSubtitleTrack: (PlayerTrackOption?) -> Unit,
              onPickExternalSubtitle: () -> Unit,
              onAdjustSubtitleDelay: (Long) -> Unit,
              onResetSubtitleDelay: () -> Unit,
              onSetSubtitleSpeed: (Float) -> Unit,
              onAnchorSubtitleSpeedHere: () -> Unit,
              onUpdateSubtitleStyle: (SubtitleFontChoice?, Float?, Int?, Float?, Float?, Boolean?, Float?) -> Unit,
              onSelectAudioTrack: (PlayerTrackOption) -> Unit,
              onPickExternalAudio: () -> Unit,
              onAdjustAudioDelay: (Long) -> Unit,
              onResetAudioDelay: () -> Unit,
              onSetVolumeBoost: (Float) -> Unit,
              onSeekToExact: (Long) -> Unit,
              onAddBookmarkNow: (String) -> Unit,
              onUpdateBookmarkLabel: (BookmarkEntity, String) -> Unit,
              onDeleteBookmark: (BookmarkEntity) -> Unit,
              onActivateSavedLoop: (SavedLoopEntity) -> Unit,
              onDeleteSavedLoop: (SavedLoopEntity) -> Unit,
              onSetPlaybackSpeed: (Float) -> Unit
          ) {
              Surface(
                  color = Color(0xFF101216).copy(alpha = 0.96f),
                  border = BorderStroke(1.dp, palette.specularBorder),
                  modifier = Modifier
                      .fillMaxHeight()
                      .width(340.dp)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(14.dp)
                  ) {
                      // Top Header & Tab Switcher
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Text(
                              text = activeTab.title,
                              style = MaterialTheme.typography.titleMedium,
                              fontWeight = FontWeight.Bold,
                              color = Color.White
                          )
                          IconButton(onClick = onClose, modifier = Modifier.size(32.dp)) {
                              Icon(Icons.Default.Close, contentDescription = "Close Panel", tint = Color.White)
                          }
                      }

                      Spacer(Modifier.height(8.dp))

                      // 4-Icon Quick Tab Bar
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          SideSheetTab.entries.forEach { tab ->
                              val selected = tab == activeTab
                              val icon = when (tab) {
                                  SideSheetTab.SUBTITLES -> Icons.Outlined.Subtitles
                                  SideSheetTab.AUDIO -> Icons.Outlined.Audiotrack
                                  SideSheetTab.BOOKMARKS_LOOPS -> Icons.Outlined.Bookmarks
                                  SideSheetTab.SPEED -> Icons.Default.Speed
                              }
                              Surface(
                                  shape = RoundedCornerShape(10.dp),
                                  color = if (selected) palette.primaryAccent else Color.White.copy(alpha = 0.08f),
                                  onClick = { onSelectTab(tab) },
                                  modifier = Modifier
                                      .weight(1f)
                                      .height(36.dp)
                              ) {
                                  Box(contentAlignment = Alignment.Center) {
                                      Icon(
                                          icon,
                                          contentDescription = tab.title,
                                          tint = if (selected) palette.onPrimaryAccent else Color.White,
                                          modifier = Modifier.size(18.dp)
                                      )
                                  }
                              }
                          }
                      }

                      HorizontalDivider(
                          modifier = Modifier.padding(vertical = 10.dp),
                          color = palette.specularBorder
                      )

                      // Tab Body Content
                      Box(modifier = Modifier.weight(1f)) {
                          when (activeTab) {
                              SideSheetTab.SUBTITLES -> SubtitleSideSheetContent(
                                  palette = palette,
                                  prefs = prefs,
                                  subtitleTracks = subtitleTracks,
                                  subtitlesEnabled = subtitlesEnabled,
                                  externalSubtitleLabel = externalSubtitleLabel,
                                  subtitleDelayMs = subtitleDelayMs,
                                  subtitleSpeedFactor = subtitleSpeedFactor,
                                  subtitleAnchorTimeMs = subtitleAnchorTimeMs,
                                  onSelectSubtitleTrack = onSelectSubtitleTrack,
                                  onPickExternalSubtitle = onPickExternalSubtitle,
                                  onAdjustSubtitleDelay = onAdjustSubtitleDelay,
                                  onResetSubtitleDelay = onResetSubtitleDelay,
                                  onSetSubtitleSpeed = onSetSubtitleSpeed,
                                  onAnchorSubtitleSpeedHere = onAnchorSubtitleSpeedHere,
                                  onUpdateSubtitleStyle = onUpdateSubtitleStyle
                              )
                              SideSheetTab.AUDIO -> AudioSideSheetContent(
                                  palette = palette,
                                  audioTracks = audioTracks,
                                  audioDelayMs = audioDelayMs,
                                  volumeFraction = volumeFraction,
                                  onSelectAudioTrack = onSelectAudioTrack,
                                  onPickExternalAudio = onPickExternalAudio,
                                  onAdjustAudioDelay = onAdjustAudioDelay,
                                  onResetAudioDelay = onResetAudioDelay,
                                  onSetVolumeBoost = onSetVolumeBoost
                              )
                              SideSheetTab.BOOKMARKS_LOOPS -> BookmarksAndLoopsSideSheetContent(
                                  palette = palette,
                                  bookmarks = bookmarks,
                                  savedLoops = savedLoops,
                                  onSeekToExact = onSeekToExact,
                                  onAddBookmarkNow = onAddBookmarkNow,
                                  onUpdateBookmarkLabel = onUpdateBookmarkLabel,
                                  onDeleteBookmark = onDeleteBookmark,
                                  onActivateSavedLoop = onActivateSavedLoop,
                                  onDeleteSavedLoop = onDeleteSavedLoop
                              )
                              SideSheetTab.SPEED -> SpeedSideSheetContent(
                                  palette = palette,
                                  playbackSpeed = playbackSpeed,
                                  onSetPlaybackSpeed = onSetPlaybackSpeed
                              )
                          }
                      }
                  }
              }
          }

          // ============================================================================
          // 4. SIDE-SHEET TAB 1: SUBTITLES (TRACKS, OFFSET + FPS SPEED SCALER, STYLE)
          // ============================================================================

          @Composable
          private fun SubtitleSideSheetContent(
              palette: VideoDynamicPalette,
              prefs: AppPreferencesState,
              subtitleTracks: List<PlayerTrackOption>,
              subtitlesEnabled: Boolean,
              externalSubtitleLabel: String?,
              subtitleDelayMs: Long,
              subtitleSpeedFactor: Float,
              subtitleAnchorTimeMs: Long,
              onSelectSubtitleTrack: (PlayerTrackOption?) -> Unit,
              onPickExternalSubtitle: () -> Unit,
              onAdjustSubtitleDelay: (Long) -> Unit,
              onResetSubtitleDelay: () -> Unit,
              onSetSubtitleSpeed: (Float) -> Unit,
              onAnchorSubtitleSpeedHere: () -> Unit,
              onUpdateSubtitleStyle: (SubtitleFontChoice?, Float?, Int?, Float?, Float?, Boolean?, Float?) -> Unit
          ) {
              var subSection by remember { mutableIntStateOf(0) } // 0=Tracks, 1=Sync & Speed, 2=Style

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      listOf("Tracks", "Sync & FPS", "Typography").forEachIndexed { idx, label ->
                          FilterChip(
                              selected = subSection == idx,
                              onClick = { subSection = idx },
                              label = { Text(label, fontSize = 11.sp) },
                              modifier = Modifier.weight(1f)
                          )
                      }
                  }

                  Spacer(Modifier.height(8.dp))

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState()),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      when (subSection) {
                          0 -> {
                              OutlinedButton(
                                  onClick = onPickExternalSubtitle,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Icon(Icons.Default.Add, contentDescription = null, modifier = Modifier.size(18.dp))
                                  Spacer(Modifier.width(6.dp))
                                  Text("+ Load Subtitle File (.srt/.ass/.vtt/.sub)")
                              }

                              if (externalSubtitleLabel != null) {
                                  Surface(
                                      shape = RoundedCornerShape(10.dp),
                                      color = palette.primaryAccent.copy(alpha = 0.2f),
                                      border = BorderStroke(1.dp, palette.primaryAccent),
                                      modifier = Modifier.fillMaxWidth()
                                  ) {
                                      Row(
                                          modifier = Modifier.padding(10.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Icon(Icons.Default.CheckCircle, contentDescription = null, tint = palette.primaryAccent)
                                          Spacer(Modifier.width(8.dp))
                                          Column {
                                              Text("External Subtitle Active", style = MaterialTheme.typography.labelSmall, color = palette.primaryAccent)
                                              Text(externalSubtitleLabel, style = MaterialTheme.typography.bodySmall, color = Color.White)
                                          }
                                      }
                                  }
                              }

                              // Off option
                              TrackRowItem(
                                  title = "Disable Subtitles (Off)",
                                  badge = "OFF",
                                  selected = !subtitlesEnabled,
                                  palette = palette,
                                  onClick = { onSelectSubtitleTrack(null) }
                              )

                              subtitleTracks.forEach { track ->
                                  TrackRowItem(
                                      title = "${track.label} (${track.language})",
                                      badge = track.codecBadge,
                                      selected = subtitlesEnabled && externalSubtitleLabel == null && track.isSelected,
                                      palette = palette,
                                      onClick = { onSelectSubtitleTrack(track) }
                                  )
                              }
                          }

                          1 -> {
                              // Dual-Parameter Subtitle Synchronization: Delay Offset + FPS Speed Scaler
                              Text(
                                  text = "Delay Offset: ${FormatUtils.formatSignedSeconds(subtitleDelayMs)}",
                                  style = TabularMonoStyle,
                                  fontWeight = FontWeight.Bold,
                                  color = palette.primaryAccent
                              )
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  MicroTunerChip(text = "-0.5s", onClick = { onAdjustSubtitleDelay(-500L) })
                                  MicroTunerChip(text = "-0.05s", onClick = { onAdjustSubtitleDelay(-50L) })
                                  MicroTunerChip(text = "+0.05s", onClick = { onAdjustSubtitleDelay(50L) })
                                  MicroTunerChip(text = "+0.5s", onClick = { onAdjustSubtitleDelay(500L) })
                                  MicroTunerChip(text = "Reset", highlightColor = palette.tertiaryLoopAccent, onClick = onResetSubtitleDelay)
                              }

                              HorizontalDivider(color = palette.specularBorder, modifier = Modifier.padding(vertical = 4.dp))

                              Text(
                                  text = String.format(Locale.US, "Subtitle Speed (FPS Scaler): %.4fx", subtitleSpeedFactor),
                                  style = TabularMonoStyle,
                                  fontWeight = FontWeight.Bold,
                                  color = palette.primaryAccent
                              )
                              Text(
                                  text = "Fixes progressive subtitle drift when subtitle frame rate differs from video frame rate.",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = Color.White.copy(alpha = 0.7f)
                              )

                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  MicroTunerChip(
                                      text = "-0.1%",
                                      onClick = { onSetSubtitleSpeed(subtitleSpeedFactor - 0.001f) }
                                  )
                                  MicroTunerChip(
                                      text = "+0.1%",
                                      onClick = { onSetSubtitleSpeed(subtitleSpeedFactor + 0.001f) }
                                  )
                                  MicroTunerChip(
                                      text = "Set Anchor Here (${FormatUtils.formatDurationMs(subtitleAnchorTimeMs)})",
                                      highlightColor = palette.tertiaryLoopAccent,
                                      onClick = onAnchorSubtitleSpeedHere
                                  )
                              }

                              Text("Cinema Frame-Rate Drift Presets:", style = MaterialTheme.typography.labelMedium, color = Color.White)
                              val fpsPresets = listOf(
                                  "23.976 \u2192 25 fps (0.9590x)" to 0.9590f,
                                  "25 \u2192 23.976 fps (1.0427x)" to 1.0427f,
                                  "24 \u2192 23.976 fps (1.0010x)" to 1.0010f,
                                  "1.0000x (Normal 1:1)" to 1.0000f
                              )
                              fpsPresets.forEach { (label, factor) ->
                                  TrackRowItem(
                                      title = label,
                                      badge = String.format(Locale.US, "%.4fx", factor),
                                      selected = abs(subtitleSpeedFactor - factor) < 0.0004f,
                                      palette = palette,
                                      onClick = { onSetSubtitleSpeed(factor) }
                                  )
                              }
                          }

                          2 -> {
                              // Typography & Styling Controls
                              Text("Bundled Subtitle Font Family", style = MaterialTheme.typography.labelMedium, color = palette.primaryAccent)
                              SubtitleFontChoice.entries.forEach { fontChoice ->
                                  TrackRowItem(
                                      title = fontChoice.label,
                                      badge = "TTF",
                                      selected = prefs.subtitleFont == fontChoice,
                                      palette = palette,
                                      onClick = { onUpdateSubtitleStyle(fontChoice, null, null, null, null, null, null) }
                                  )
                              }

                              Text(
                                  "Font Size: ${prefs.subtitleFontSizeSp.roundToInt()} sp",
                                  style = TabularNumeralStyle,
                                  color = Color.White
                              )
                              Slider(
                                  value = prefs.subtitleFontSizeSp,
                                  onValueChange = { onUpdateSubtitleStyle(null, it, null, null, null, null, null) },
                                  valueRange = 14f..42f
                              )

                              Text("Subtitle Text Color", style = MaterialTheme.typography.labelMedium, color = Color.White)
                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  val colors = listOf(
                                      0xFFFFFFFF.toInt(),
                                      0xFFFFEA00.toInt(),
                                      0xFF00E5FF.toInt(),
                                      0xFF69F0AE.toInt(),
                                      0xFFFF80AB.toInt()
                                  )
                                  colors.forEach { argb ->
                                      Box(
                                          modifier = Modifier
                                              .size(30.dp)
                                              .clip(CircleShape)
                                              .background(Color(argb))
                                              .border(
                                                  width = if (prefs.subtitleTextColorArgb == argb) 3.dp else 1.dp,
                                                  color = if (prefs.subtitleTextColorArgb == argb) palette.primaryAccent else Color.White,
                                                  shape = CircleShape
                                              )
                                              .clickable { onUpdateSubtitleStyle(null, null, argb, null, null, null, null) }
                                      )
                                  }
                              }

                              Text(
                                  "Outline Stroke Width: ${String.format(Locale.US, "%.1f dp", prefs.subtitleOutlineWidthDp)}",
                                  style = TabularNumeralStyle,
                                  color = Color.White
                              )
                              Slider(
                                  value = prefs.subtitleOutlineWidthDp,
                                  onValueChange = { onUpdateSubtitleStyle(null, null, null, it, null, null, null) },
                                  valueRange = 0f..5f
                              )

                              Text(
                                  "Background Box Opacity: ${(prefs.subtitleBgOpacity * 100).roundToInt()}%",
                                  style = TabularNumeralStyle,
                                  color = Color.White
                              )
                              Slider(
                                  value = prefs.subtitleBgOpacity,
                                  onValueChange = { onUpdateSubtitleStyle(null, null, null, null, it, null, null) },
                                  valueRange = 0f..1f
                              )

                              Text(
                                  "Bottom Margin Offset: ${prefs.subtitleBottomMarginDp.roundToInt()} dp",
                                  style = TabularNumeralStyle,
                                  color = Color.White
                              )
                              Slider(
                                  value = prefs.subtitleBottomMarginDp,
                                  onValueChange = { onUpdateSubtitleStyle(null, null, null, null, null, null, it) },
                                  valueRange = 8f..100f
                              )
                          }
                      }
                  }
              }
          }

          // ============================================================================
          // 5. SIDE-SHEET TAB 2: AUDIO TRACKS & BIDIRECTIONAL PCM DELAY (-5s to +5s)
          // ============================================================================

          @Composable
          private fun AudioSideSheetContent(
              palette: VideoDynamicPalette,
              audioTracks: List<PlayerTrackOption>,
              audioDelayMs: Long,
              volumeFraction: Float,
              onSelectAudioTrack: (PlayerTrackOption) -> Unit,
              onPickExternalAudio: () -> Unit,
              onAdjustAudioDelay: (Long) -> Unit,
              onResetAudioDelay: () -> Unit,
              onSetVolumeBoost: (Float) -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Text(
                      text = "Bidirectional Audio Sync: ${FormatUtils.formatSignedSeconds(audioDelayMs)}",
                      style = TabularMonoStyle,
                      fontWeight = FontWeight.Bold,
                      color = palette.primaryAccent
                  )
                  Text(
                      text = "Backed by circular PCM ring-buffer DelayingAudioProcessor (-5000ms to +5000ms).",
                      style = MaterialTheme.typography.bodySmall,
                      color = Color.White.copy(alpha = 0.7f)
                  )
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      MicroTunerChip(text = "-0.25s", onClick = { onAdjustAudioDelay(-250L) })
                      MicroTunerChip(text = "-0.05s", onClick = { onAdjustAudioDelay(-50L) })
                      MicroTunerChip(text = "+0.05s", onClick = { onAdjustAudioDelay(50L) })
                      MicroTunerChip(text = "+0.25s", onClick = { onAdjustAudioDelay(250L) })
                      MicroTunerChip(text = "Reset", highlightColor = palette.tertiaryLoopAccent, onClick = onResetAudioDelay)
                  }

                  HorizontalDivider(color = palette.specularBorder)

                  val pct = (volumeFraction * 100f).roundToInt()
                  Text(
                      text = "Volume & LoudnessEnhancer Boost: $pct%",
                      style = TabularNumeralStyle,
                      fontWeight = FontWeight.Bold,
                      color = if (pct > 100) palette.tertiaryLoopAccent else Color.White
                  )
                  Slider(
                      value = volumeFraction,
                      onValueChange = onSetVolumeBoost,
                      valueRange = 0f..2.0f
                  )

                  HorizontalDivider(color = palette.specularBorder)

                  OutlinedButton(
                      onClick = onPickExternalAudio,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Icon(Icons.Default.AudioFile, contentDescription = null, modifier = Modifier.size(18.dp))
                      Spacer(Modifier.width(6.dp))
                      Text("+ Load External Audio Track")
                  }

                  Text("Embedded Audio Streams", style = MaterialTheme.typography.labelMedium, color = palette.primaryAccent)
                  audioTracks.forEach { track ->
                      TrackRowItem(
                          title = "${track.label} (${track.language})",
                          badge = "${track.codecBadge} • ${track.detailsBadge}",
                          selected = track.isSelected,
                          palette = palette,
                          onClick = { onSelectAudioTrack(track) }
                      )
                  }
              }
          }

          // ============================================================================
          // 6. SIDE-SHEET TAB 3: BOOKMARKS & SAVED A-B LOOPS
          // ============================================================================

          @Composable
          private fun BookmarksAndLoopsSideSheetContent(
              palette: VideoDynamicPalette,
              bookmarks: List<BookmarkEntity>,
              savedLoops: List<SavedLoopEntity>,
              onSeekToExact: (Long) -> Unit,
              onAddBookmarkNow: (String) -> Unit,
              onUpdateBookmarkLabel: (BookmarkEntity, String) -> Unit,
              onDeleteBookmark: (BookmarkEntity) -> Unit,
              onActivateSavedLoop: (SavedLoopEntity) -> Unit,
              onDeleteSavedLoop: (SavedLoopEntity) -> Unit
          ) {
              var editingBookmark by remember { mutableStateOf<BookmarkEntity?>(null) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Button(
                      onClick = { onAddBookmarkNow("") },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Icon(Icons.Default.BookmarkAdd, contentDescription = null)
                      Spacer(Modifier.width(6.dp))
                      Text("Pin Bookmark at Current Frame")
                  }

                  Text(
                      "Pinned Video Bookmarks (${bookmarks.size})",
                      style = MaterialTheme.typography.labelMedium,
                      color = palette.primaryAccent
                  )
                  if (bookmarks.isEmpty()) {
                      Text(
                          "No bookmarks pinned yet. Tap [Bookmark +] on the OSD to drop a diamond marker.",
                          style = MaterialTheme.typography.bodySmall,
                          color = Color.White.copy(alpha = 0.65f)
                      )
                  } else {
                      bookmarks.forEach { bm ->
                          Surface(
                              shape = RoundedCornerShape(10.dp),
                              color = Color.White.copy(alpha = 0.07f),
                              border = BorderStroke(1.dp, palette.specularBorder),
                              onClick = { onSeekToExact(bm.timestampMs) },
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Row(
                                  modifier = Modifier.padding(10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(bm.label, style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.Bold, color = Color.White)
                                      Text(
                                          FormatUtils.formatPreciseCentiseconds(bm.timestampMs),
                                          style = TabularMonoStyle,
                                          fontSize = 11.sp,
                                          color = palette.tertiaryLoopAccent
                                      )
                                  }
                                  IconButton(onClick = { editingBookmark = bm }, modifier = Modifier.size(28.dp)) {
                                      Icon(Icons.Default.Edit, contentDescription = "Rename", tint = Color.White, modifier = Modifier.size(16.dp))
                                  }
                                  IconButton(onClick = { onDeleteBookmark(bm) }, modifier = Modifier.size(28.dp)) {
                                      Icon(Icons.Default.DeleteOutline, contentDescription = "Delete", tint = Color(0xFFFF6B6B), modifier = Modifier.size(16.dp))
                                  }
                              }
                          }
                      }
                  }

                  HorizontalDivider(color = palette.specularBorder)

                  Text(
                      "Saved A-B Loops (${savedLoops.size})",
                      style = MaterialTheme.typography.labelMedium,
                      color = palette.tertiaryLoopAccent
                  )
                  if (savedLoops.isEmpty()) {
                      Text(
                          "Set an A-B loop on the timeline and tap [Save Loop] to store reusable study/scene loops.",
                          style = MaterialTheme.typography.bodySmall,
                          color = Color.White.copy(alpha = 0.65f)
                      )
                  } else {
                      savedLoops.forEach { loop ->
                          Surface(
                              shape = RoundedCornerShape(10.dp),
                              color = palette.tertiaryLoopAccent.copy(alpha = 0.14f),
                              border = BorderStroke(1.dp, palette.tertiaryLoopAccent.copy(alpha = 0.5f)),
                              onClick = { onActivateSavedLoop(loop) },
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Row(
                                  modifier = Modifier.padding(10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(loop.label, style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.Bold, color = Color.White)
                                      Text(
                                          "${FormatUtils.formatPreciseCentiseconds(loop.startMs)} \u2192 ${FormatUtils.formatPreciseCentiseconds(loop.endMs)}",
                                          style = TabularMonoStyle,
                                          fontSize = 11.sp,
                                          color = palette.tertiaryLoopAccent
                                      )
                                  }
                                  IconButton(onClick = { onDeleteSavedLoop(loop) }, modifier = Modifier.size(28.dp)) {
                                      Icon(Icons.Default.DeleteOutline, contentDescription = "Delete Loop", tint = Color(0xFFFF6B6B), modifier = Modifier.size(16.dp))
                                  }
                              }
                          }
                      }
                  }
              }

              editingBookmark?.let { target ->
                  var labelText by remember(target) { mutableStateOf(target.label) }
                  AlertDialog(
                      onDismissRequest = { editingBookmark = null },
                      title = { Text("Edit Bookmark Label") },
                      text = {
                          OutlinedTextField(
                              value = labelText,
                              onValueChange = { labelText = it },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )
                      },
                      confirmButton = {
                          Button(onClick = {
                              onUpdateBookmarkLabel(target, labelText)
                              editingBookmark = null
                          }) { Text("Save") }
                      },
                      dismissButton = {
                          TextButton(onClick = { editingBookmark = null }) { Text("Cancel") }
                      }
                  )
              }
          }

          // ============================================================================
          // 7. SIDE-SHEET TAB 4: PRECISION PLAYBACK SPEED CONTROLLER
          // ============================================================================

          @Composable
          private fun SpeedSideSheetContent(
              palette: VideoDynamicPalette,
              playbackSpeed: Float,
              onSetPlaybackSpeed: (Float) -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text(
                      text = String.format(Locale.US, "Active Speed: %.2fx", playbackSpeed),
                      style = TabularMonoStyle,
                      fontSize = 16.sp,
                      fontWeight = FontWeight.Bold,
                      color = palette.primaryAccent
                  )

                  Slider(
                      value = playbackSpeed,
                      onValueChange = { onSetPlaybackSpeed((it * 20f).roundToInt() / 20f) },
                      valueRange = 0.25f..4.0f
                  )

                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      MicroTunerChip(text = "-0.05x", onClick = { onSetPlaybackSpeed(playbackSpeed - 0.05f) })
                      MicroTunerChip(text = "+0.05x", onClick = { onSetPlaybackSpeed(playbackSpeed + 0.05f) })
                      MicroTunerChip(text = "Reset 1.00x", highlightColor = palette.tertiaryLoopAccent, onClick = { onSetPlaybackSpeed(1.0f) })
                  }

                  Text("Quick Cinema & Lecture Speed Presets", style = MaterialTheme.typography.labelMedium, color = Color.White)
                  val speeds = listOf(0.25f, 0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 1.75f, 2.0f, 2.5f, 3.0f, 4.0f)
                  speeds.forEach { spd ->
                      TrackRowItem(
                          title = String.format(Locale.US, "%.2fx Playback", spd),
                          badge = if (spd == 1.0f) "NORMAL" else "${spd}x",
                          selected = abs(playbackSpeed - spd) < 0.02f,
                          palette = palette,
                          onClick = { onSetPlaybackSpeed(spd) }
                      )
                  }
              }
          }

          @Composable
          private fun TrackRowItem(
              title: String,
              badge: String,
              selected: Boolean,
              palette: VideoDynamicPalette,
              onClick: () -> Unit
          ) {
              Surface(
                  shape = RoundedCornerShape(10.dp),
                  color = if (selected) palette.primaryAccent.copy(alpha = 0.20f) else Color.White.copy(alpha = 0.06f),
                  border = BorderStroke(
                      1.dp,
                      if (selected) palette.primaryAccent else palette.specularBorder
                  ),
                  onClick = onClick,
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Row(
                      modifier = Modifier.padding(horizontal = 12.dp, vertical = 9.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Text(
                          text = title,
                          style = MaterialTheme.typography.bodySmall,
                          fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal,
                          color = Color.White,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          modifier = Modifier.weight(1f)
                      )
                      Spacer(Modifier.width(8.dp))
                      Text(
                          text = badge,
                          style = TabularMonoStyle,
                          fontSize = 10.sp,
                          fontWeight = FontWeight.Bold,
                          color = if (selected) palette.primaryAccent else Color.White.copy(alpha = 0.7f)
                      )
                  }
              }
          }
