              fun renameVideo(video: LocalVideoItem, newTitleWithoutExt: String) {
                  viewModelScope.launch {
                      val result = TrashAndRenameManager.renameVideoPreservingState(
                          context = appContext,
                          dao = dao,
                          video = video,
                          newNameWithoutExt = newTitleWithoutExt
                      )
                      result.onSuccess { newName ->
                          _snackbarMessage.emit("Renamed to $newName (Bookmarks & Resume preserved)")
                          refreshLibrary()
                      }.onFailure { err ->
                          _snackbarMessage.emit("Rename failed: ${err.localizedMessage ?: "Permission denied"}")
                      }
