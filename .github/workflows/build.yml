name: Build VDX Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vdx-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b682569dd4e08acf67170a2b42d829\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e44e3bb4530a66d34b880fb" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and run generator from the big file
        run: |
          yq '.jobs.build-vdx-apk.steps[] | select(.name == "Generate Project Structure, Fonts, Gradle Configs & Source Code") | .run' ci/vdx-build-full.yml > generate.sh
          bash generate.sh

      - name: Patch PiP variable name
        run: |
          F=app/src/main/java/com/flagship/videoplayer/ui/player/PlayerScreenAndGestures.kt
          sed -i 's/if (doubleTapSide != 0 && doubleTapAccumulatedSec != 0) {/if (doubleTapSide != 0 \&\& doubleTapSeekAccumulatedSec != 0) {/' "$F"
          sed -i 's/else "-"}${abs(doubleTapAccumulatedSec)}s"/else "-"}${abs(doubleTapSeekAccumulatedSec)}s"/' "$F"

      - name: Use fresh database and settings names (avoids stale-data launch crash)
        run: |
          F=app/src/main/java/com/flagship/videoplayer/data/DatabaseAndModels.kt
          sed -i 's/vdx_flagship_player_v7\.db/vdx_flagship_player_v8.db/' "$F"
          sed -i 's/vdx_player_prefs_v7/vdx_player_prefs_v8/' "$F"

      - name: Add on-screen crash reporter
        run: |
          D=app/src/main/java/com/flagship/videoplayer
          cat << 'EOF' > $D/CrashReporter.kt
          package com.flagship.videoplayer

          import android.app.Activity
          import android.app.Application
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Process
          import android.widget.ScrollView
          import android.widget.TextView
          import java.io.PrintWriter
          import java.io.StringWriter
          import kotlin.system.exitProcess

          class VdxApp : Application() {
              override fun onCreate() {
                  super.onCreate()
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      try {
                          val sw = StringWriter()
                          error.printStackTrace(PrintWriter(sw))
                          val trace = "Thread: ${thread.name}\n\n$sw".take(40000)
                          val intent = Intent(this, CrashActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)
                              putExtra("trace", trace)
                          }
                          startActivity(intent)
                          Thread.sleep(600)
                      } catch (t: Throwable) {
                          previous?.uncaughtException(thread, error)
                      }
                      Process.killProcess(Process.myPid())
                      exitProcess(10)
                  }
              }
          }

          class CrashActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val trace = intent.getStringExtra("trace") ?: "No trace received"
                  val tv = TextView(this).apply {
                      text = trace
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      setTextIsSelectable(true)
                      setPadding(32, 120, 32, 48)
                  }
                  val sv = ScrollView(this).apply {
                      setBackgroundColor(Color.BLACK)
                      addView(tv)
                  }
                  setContentView(sv)
              }
          }
          EOF
          M=app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application\n        android:name=".VdxApp"/' "$M"
          sed -i 's#</application>#    <activity android:name=".CrashActivity" android:exported="false" android:process=":crash" />\n    </application>#' "$M"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload VDX Player APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDX-Player-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
