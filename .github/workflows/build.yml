              }

              fun moveVideoToTrash(video: LocalVideoItem) {
                  viewModelScope.launch {
                      TrashAndRenameManager.moveVideoToTrash(appContext, dao, video)
                          .onSuccess {
                              _snackbarMessage.emit("Moved \"${video.displayName}\" to 30-Day Trash")
