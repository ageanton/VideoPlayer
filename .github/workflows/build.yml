name: Build Flagship Cinema Video Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flagship-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Build Tools 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Project Structure, Fonts, Gradle Configs & Source Code
        run: |
          set -e
          mkdir -p app/src/main/java/com/flagship/videoplayer/data
          mkdir -p app/src/main/java/com/flagship/videoplayer/ui/theme
          mkdir -p app/src/main/java/com/flagship/videoplayer/ui/home
          mkdir -p app/src/main/java/com/flagship/videoplayer/ui/player
          mkdir -p app/src/main/java/com/flagship/videoplayer/engine
          mkdir -p app/src/main/res/font
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # Download genuine TrueType fonts with automatic local TTF validation fallback
          sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core fonts-liberation2 curl file

          download_or_fallback_font() {
            local url="$1"
            local dest="$2"
            local fallback="$3"
            curl -sL --retry 3 --connect-timeout 10 "$url" -o "$dest" || true
            if [ ! -s "$dest" ] || ! file "$dest" | grep -qiE "font|TrueType|OpenType"; then
              cp "$fallback" "$dest"
            fi
          }

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/inter_regular.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/inter_medium.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/inter_bold.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/barlowcondensed/BarlowCondensed-Medium.ttf" \
            "app/src/main/res/font/cinesans_regular.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/barlowcondensed/BarlowCondensed-Bold.ttf" \
            "app/src/main/res/font/cinesans_bold.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf"

          download_or_fallback_font \
            "https://github.com/JetBrains/JetBrainsMono/raw/master/fonts/ttf/JetBrainsMono-Regular.ttf" \
            "app/src/main/res/font/jetbrains_mono_regular.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FlagshipVideoPlayer"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.flagship.videoplayer"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.flagship.videoplayer"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 100
                  versionName = "1.0.0-Flagship"

                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  debug {
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-DEBUG"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.media3.common.util.UnstableApi",
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                      "-opt-in=androidx.compose.animation.ExperimentalAnimationApi"
                  )
              }

              buildFeatures {
                  compose = true
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.documentfile:documentfile:1.0.1")

              // Media3 Core, Streaming Protocols & Jellyfin FFmpeg Extension
              val media3Version = "1.5.0"
              implementation("androidx.media3:media3-exoplayer:$media3Version")
              implementation("androidx.media3:media3-exoplayer-hls:$media3Version")
              implementation("androidx.media3:media3-exoplayer-dash:$media3Version")
              implementation("androidx.media3:media3-exoplayer-smoothstreaming:$media3Version")
              implementation("androidx.media3:media3-exoplayer-rtsp:$media3Version")
              implementation("androidx.media3:media3-datasource-okhttp:$media3Version")
              implementation("androidx.media3:media3-ui:$media3Version")
              implementation("androidx.media3:media3-session:$media3Version")
              implementation("androidx.media3:media3-common:$media3Version")
              implementation("org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1")

              // Networking
              implementation("com.squareup.okhttp3:okhttp:4.12.0")

              // Room Database & KSP
              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")

              // DataStore Preferences
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // Palette for Dynamic Per-Video Accent Extraction
              implementation("androidx.palette:palette-ktx:1.0.0")

              // Coil for Async Video Thumbnails
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("io.coil-kt:coil-video:2.7.0")

              // Coroutines
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FlagshipVideoPlayer" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0E0F12"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#7C4DFF"
                  android:pathData="M26,26 C26,20 32,18 38,21 L82,47 C88,50 88,58 82,61 L38,87 C32,90 26,88 26,82 Z"/>
              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M42,38 L68,54 L42,70 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
              <files-path name="internal_files" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher_foreground"
                  android:roundIcon="@drawable/ic_launcher_foreground"
                  android:label="CinePulse Pro"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:largeHeap="true"
                  android:theme="@style/Theme.FlagshipVideoPlayer">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:launchMode="singleTask"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                          <data android:scheme="rtsp" />
                          <data android:mimeType="video/*" />
                          <data android:mimeType="application/vnd.apple.mpegurl" />
                          <data android:mimeType="application/x-mpegurl" />
                          <data android:mimeType="application/dash+xml" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/flagship/videoplayer/data/DatabaseAndModels.kt
          package com.flagship.videoplayer.data

          import android.content.ContentResolver
          import android.content.ContentUris
          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import androidx.datastore.core.DataStore
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import androidx.room.*
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.catch
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.RandomAccessFile
          import java.security.MessageDigest

          // ============================================================================
          // 1. CORE ENUMS & DOMAIN MODELS
          // ============================================================================

          enum class AppThemeMode(val label: String) {
              SYSTEM("System Default"),
              LIGHT("Light Mode"),
              DARK_CHARCOAL("Dark Charcoal (#121316)"),
              TRUE_OLED("True OLED Black (#000000)")
          }

          enum class LibraryViewMode(val label: String) {
              FOLDER("Folders"),
              RICH_LIST("Rich List"),
              COMFORT_GRID("Comfort Grid"),
              COMPACT_GRID("Compact Grid")
          }

          enum class LibrarySortField(val label: String) {
              NAME("Title"),
              DATE_MODIFIED("Date Added"),
              SIZE("File Size"),
              DURATION("Duration"),
              LAST_PLAYED("Last Played")
          }

          enum class DecoderMode(val badge: String, val description: String) {
              HW("HW", "Strict Hardware MediaCodec"),
              HW_PLUS("HW+", "Hybrid Hardware + FFmpeg Fallback"),
              SW("SW", "Prefer FFmpeg Software Decoder")
          }

          enum class AspectRatioMode(val label: String) {
              FIT("Fit Screen"),
              FILL("Fill / Crop"),
              STRETCH("Stretch"),
              RATIO_16_9("16:9 Widescreen"),
              RATIO_4_3("4:3 Classic")
          }

          enum class PlayerOrientationMode(val label: String) {
              SENSOR_LANDSCAPE("Sensor Landscape"),
              PORTRAIT("Portrait"),
              REVERSE_LANDSCAPE("Reverse Landscape"),
              MATCH_VIDEO("Match Video"),
              AUTO_SYSTEM("System Auto")
          }

          enum class SubtitleFontChoice(val label: String) {
              INTER("Inter (Default UI)"),
              CINESANS("CineSans Condensed"),
              SANS_SERIF("Roboto Sans"),
              MONOSPACE("JetBrains Mono"),
              SERIF("Cinema Serif")
          }

          data class LocalVideoItem(
              val mediaStoreId: Long,
              val contentUri: Uri,
              val filePath: String,
              val folderPath: String,
              val folderName: String,
              val displayName: String,
              val titleWithoutExt: String,
              val extensionBadge: String,
              val sizeBytes: Long,
              val durationMs: Long,
              val width: Int,
              val height: Int,
              val resolutionBadge: String,
              val dateModifiedSec: Long,
              val sidecarSubtitleFiles: List<File>,
              val fileFingerprint: String,
              val savedPositionMs: Long = 0L,
              val lastPlayedAtMs: Long = 0L,
              val isNetworkStream: Boolean = false,
              val customHeaders: Map<String, String> = emptyMap(),
              val userAgent: String = "",
              val referer: String = ""
          ) {
              val completionFraction: Float
                  get() = if (durationMs > 0L) (savedPositionMs.toFloat() / durationMs.toFloat()).coerceIn(0f, 1f) else 0f

              val hasSidecarSubtitles: Boolean
                  get() = sidecarSubtitleFiles.isNotEmpty()
          }

          data class VideoFolderItem(
              val folderPath: String,
              val folderName: String,
              val videos: List<LocalVideoItem>,
              val totalSizeBytes: Long,
              val unplayedCount: Int,
              val lastPlayedVideo: LocalVideoItem?
          )

          // ============================================================================
          // 2. ROOM ENTITIES
          // ============================================================================

          @Entity(tableName = "video_states")
          data class VideoStateEntity(
              @PrimaryKey val fileFingerprint: String,
              val filePath: String,
              val folderPath: String,
              val displayName: String,
              val positionMs: Long = 0L,
              val durationMs: Long = 0L,
              val lastPlayedAtMs: Long = 0L,
              val playbackSpeed: Float = 1.0f,
              val decoderMode: String = DecoderMode.HW_PLUS.name,
              val zoomScale: Float = 1.0f,
              val panOffsetX: Float = 0f,
              val panOffsetY: Float = 0f,
              val aspectRatioMode: String = AspectRatioMode.FIT.name,
              val orientationMode: String = PlayerOrientationMode.SENSOR_LANDSCAPE.name,
              val audioTrackIndex: Int = -1,
              val externalAudioUri: String? = null,
              val audioDelayMs: Long = 0L,
              val audioBoostGainMb: Int = 0,
              val subtitleTrackIndex: Int = -1,
              val externalSubtitleUri: String? = null,
              val subtitleDelayMs: Long = 0L,
              val subtitleSpeedFactor: Float = 1.0f,
              val subtitleAnchorTimeMs: Long = 0L
          )

          @Entity(
              tableName = "video_bookmarks",
              indices = [Index(value = ["videoFingerprint"])]
          )
          data class BookmarkEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0L,
              val videoFingerprint: String,
              val timestampMs: Long,
              val label: String,
              val createdAtMs: Long = System.currentTimeMillis()
          )

          @Entity(
              tableName = "saved_ab_loops",
              indices = [Index(value = ["videoFingerprint"])]
          )
          data class SavedLoopEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0L,
              val videoFingerprint: String,
              val label: String,
              val startMs: Long,
              val endMs: Long,
              val createdAtMs: Long = System.currentTimeMillis()
          )

          @Entity(tableName = "trashed_videos")
          data class TrashedVideoEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0L,
              val fileFingerprint: String,
              val originalPath: String,
              val trashPath: String,
              val displayName: String,
              val sizeBytes: Long,
              val durationMs: Long,
              val trashedAtMs: Long,
              val expiresAtMs: Long
          ) {
              fun daysRemaining(nowMs: Long = System.currentTimeMillis()): Int {
                  val diff = (expiresAtMs - nowMs).coerceAtLeast(0L)
                  return ((diff / (24L * 3600_000L)) + 1L).toInt().coerceAtMost(30)
              }
          }

          @Entity(tableName = "network_stream_history")
          data class NetworkStreamHistoryEntity(
              @PrimaryKey val streamUrl: String,
              val title: String,
              val protocolBadge: String,
              val userAgent: String = "",
              val referer: String = "",
              val headersSerialized: String = "",
              val lastPositionMs: Long = 0L,
              val durationMs: Long = 0L,
              val lastPlayedAtMs: Long = System.currentTimeMillis()
          ) {
              fun parsedHeaders(): Map<String, String> {
                  if (headersSerialized.isBlank()) return emptyMap()
                  return headersSerialized.lines()
                      .mapNotNull { line ->
                          val idx = line.indexOf(':')
                          if (idx > 0) {
                              line.substring(0, idx).trim() to line.substring(idx + 1).trim()
                          } else null
                      }.toMap()
              }

              companion object {
                  fun serializeHeaders(headers: Map<String, String>): String {
                      return headers.entries.joinToString("\n") { "${it.key}: ${it.value}" }
                  }

                  fun detectProtocolBadge(url: String): String {
                      val lower = url.lowercase()
                      return when {
                          lower.startsWith("rtsp://") -> "RTSP"
                          lower.contains(".m3u8") -> "HLS"
                          lower.contains(".mpd") -> "DASH"
                          lower.contains(".ism") -> "SMOOTH"
                          lower.contains(".mkv") -> "MKV HTTP"
                          lower.contains(".webm") -> "WEBM HTTP"
                          lower.startsWith("https://") -> "HTTPS"
                          else -> "HTTP"
                      }
                  }
              }
          }

          // ============================================================================
          // 3. ROOM DAOs & DATABASE
          // ============================================================================

          @Dao
          interface FlagshipPlayerDao {
              @Query("SELECT * FROM video_states")
              fun observeAllVideoStates(): Flow<List<VideoStateEntity>>

              @Query("SELECT * FROM video_states WHERE fileFingerprint = :fingerprint LIMIT 1")
              suspend fun getVideoState(fingerprint: String): VideoStateEntity?

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun upsertVideoState(state: VideoStateEntity)

              @Query("SELECT * FROM video_states WHERE lastPlayedAtMs > 0 ORDER BY lastPlayedAtMs DESC LIMIT 1")
              fun observeGloballyLastPlayed(): Flow<VideoStateEntity?>

              @Query("SELECT * FROM video_states WHERE folderPath = :folderPath AND lastPlayedAtMs > 0 ORDER BY lastPlayedAtMs DESC LIMIT 1")
              fun observeLastPlayedInFolder(folderPath: String): Flow<VideoStateEntity?>

              @Query("UPDATE video_states SET filePath = :newPath, folderPath = :newFolder, displayName = :newDisplayName WHERE fileFingerprint = :fingerprint")
              suspend fun updateRenamedVideoMetadata(
                  fingerprint: String,
                  newPath: String,
                  newFolder: String,
                  newDisplayName: String
              )

              // Bookmarks
              @Query("SELECT * FROM video_bookmarks WHERE videoFingerprint = :fingerprint ORDER BY timestampMs ASC")
              fun observeBookmarks(fingerprint: String): Flow<List<BookmarkEntity>>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertBookmark(bookmark: BookmarkEntity): Long

              @Update
              suspend fun updateBookmark(bookmark: BookmarkEntity)

              @Delete
              suspend fun deleteBookmark(bookmark: BookmarkEntity)

              // Saved A-B Loops
              @Query("SELECT * FROM saved_ab_loops WHERE videoFingerprint = :fingerprint ORDER BY startMs ASC")
              fun observeSavedLoops(fingerprint: String): Flow<List<SavedLoopEntity>>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertSavedLoop(loop: SavedLoopEntity): Long

              @Delete
              suspend fun deleteSavedLoop(loop: SavedLoopEntity)

              // 30-Day Trash Bin
              @Query("SELECT * FROM trashed_videos ORDER BY trashedAtMs DESC")
              fun observeTrashedVideos(): Flow<List<TrashedVideoEntity>>

              @Query("SELECT * FROM trashed_videos")
              suspend fun getAllTrashedVideosOnce(): List<TrashedVideoEntity>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertTrashedVideo(item: TrashedVideoEntity)

              @Delete
              suspend fun deleteTrashedVideoRecord(item: TrashedVideoEntity)

              @Query("SELECT * FROM trashed_videos WHERE expiresAtMs < :nowMs")
              suspend fun getExpiredTrashedVideos(nowMs: Long): List<TrashedVideoEntity>

              // Network Streams
              @Query("SELECT * FROM network_stream_history ORDER BY lastPlayedAtMs DESC")
              fun observeNetworkStreams(): Flow<List<NetworkStreamHistoryEntity>>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun upsertNetworkStream(stream: NetworkStreamHistoryEntity)

              @Delete
              suspend fun deleteNetworkStream(stream: NetworkStreamHistoryEntity)

              @Query("DELETE FROM network_stream_history")
              suspend fun clearAllNetworkStreams()
          }

          @Database(
              entities = [
                  VideoStateEntity::class,
                  BookmarkEntity::class,
                  SavedLoopEntity::class,
                  TrashedVideoEntity::class,
                  NetworkStreamHistoryEntity::class
              ],
              version = 1,
              exportSchema = false
          )
          abstract class FlagshipDatabase : RoomDatabase() {
              abstract fun dao(): FlagshipPlayerDao

              companion object {
                  @Volatile
                  private var INSTANCE: FlagshipDatabase? = null

                  fun getInstance(context: Context): FlagshipDatabase {
                      return INSTANCE ?: synchronized(this) {
                          val instance = Room.databaseBuilder(
                              context.applicationContext,
                              FlagshipDatabase::class.java,
                              "flagship_cinema_player.db"
                          ).fallbackToDestructiveMigration().build()
                          INSTANCE = instance
                          instance
                      }
                  }
              }
