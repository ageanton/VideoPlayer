          // ============================================================================
          // 3. PER-VIDEO DYNAMIC PALETTE EXTRACTOR & FORCED-DARK OSD CINEMA THEME
          // ============================================================================

          data class VideoDynamicPalette(
              val primaryAccent: Color = Color(0xFF9C7CFF),
              val onPrimaryAccent: Color = Color(0xFF140C2E),
              val primaryGlow: Color = Color(0xFF7C4DFF),
              val tertiaryLoopAccent: Color = Color(0xFFFFB74D),
              val osdSurface: Color = Color(0xFF0E0F12).copy(alpha = 0.84f),
              val osdElevatedSurface: Color = Color(0xFF1E1F24).copy(alpha = 0.88f),
              val specularBorder: Color = Color.White.copy(alpha = 0.13f)
          )

          object DynamicVideoAccentExtractor {
              private val paletteCache = java.util.concurrent.ConcurrentHashMap<String, VideoDynamicPalette>()

              suspend fun extractPaletteForVideo(
                  context: Context,
                  key: String,
                  uri: Uri?,
                  filePath: String?,
                  isNetworkStream: Boolean
              ): VideoDynamicPalette = withContext(Dispatchers.IO) {
                  paletteCache[key]?.let { return@withContext it }

                  if (isNetworkStream) {
                      val streamPalette = VideoDynamicPalette(
                          primaryAccent = Color(0xFF00E5FF),
                          onPrimaryAccent = Color(0xFF00262B),
                          primaryGlow = Color(0xFF00B8D4),
                          tertiaryLoopAccent = Color(0xFFFFAB40)
                      )
                      paletteCache[key] = streamPalette
                      return@withContext streamPalette
                  }

                  val retriever = MediaMetadataRetriever()
                  val bitmap: Bitmap? = try {
                      if (!filePath.isNullOrBlank() && java.io.File(filePath).exists()) {
                          retriever.setDataSource(filePath)
                      } else if (uri != null) {
                          retriever.setDataSource(context, uri)
                      } else {
                          null
                      }
                      retriever.getFrameAtTime(5_000_000L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                          ?: retriever.getFrameAtTime(0L)
                  } catch (e: Exception) {
                      null
                  } finally {
                      runCatching { retriever.release() }
                  }

                  if (bitmap == null) {
                      return@withContext VideoDynamicPalette()
                  }

                  return@withContext try {
                      val palette = Palette.from(bitmap).maximumColorCount(16).generate()
                      val rawRgb = palette.getVibrantColor(
                          palette.getLightVibrantColor(
                              palette.getDominantColor(0xFF9C7CFF.toInt())
                          )
                      )
                      val hsl = FloatArray(3)
                      ColorUtils.colorToHSL(rawRgb, hsl)
                      // Boost lightness and saturation so the accent pops clearly against dark cinema chrome
                      hsl[1] = hsl[1].coerceIn(0.55f, 0.95f)
                      hsl[2] = hsl[2].coerceIn(0.64f, 0.80f)
                      val primaryColor = Color(ColorUtils.HSLToColor(hsl))

                      // Compute complementary warm/tertiary hue shifted by +145 degrees for A-B Loop & Bookmarks
                      val compHsl = floatArrayOf((hsl[0] + 145f) % 360f, 0.90f, 0.68f)
                      val tertiaryColor = Color(ColorUtils.HSLToColor(compHsl))

                      val result = VideoDynamicPalette(
                          primaryAccent = primaryColor,
                          onPrimaryAccent = if (primaryColor.luminance() > 0.45f) Color(0xFF101114) else Color.White,
                          primaryGlow = primaryColor.copy(alpha = 0.45f),
                          tertiaryLoopAccent = tertiaryColor
                      )
                      paletteCache[key] = result
                      result
                  } catch (e: Exception) {
                      VideoDynamicPalette()
                  } finally {
                      runCatching { bitmap.recycle() }
                  }
              }
          }

          // ============================================================================
          // 4. PRECISION FORMATTING UTILITIES (TIMESTAMPS, DECIS, FILE SIZES)
          // ============================================================================

          object FormatUtils {
              fun formatDurationMs(durationMs: Long): String {
                  val safeMs = durationMs.coerceAtLeast(0L)
                  val totalSec = safeMs / 1000L
                  val hours = totalSec / 3600L
                  val minutes = (totalSec % 3600L) / 60L
                  val seconds = totalSec % 60L
                  return if (hours > 0L) {
                      String.format(Locale.US, "%d:%02d:%02d", hours, minutes, seconds)
                  } else {
                      String.format(Locale.US, "%02d:%02d", minutes, seconds)
                  }
              }

              fun formatPreciseCentiseconds(timeMs: Long): String {
                  val safeMs = timeMs.coerceAtLeast(0L)
                  val totalSec = safeMs / 1000L
                  val hours = totalSec / 3600L
                  val minutes = (totalSec % 3600L) / 60L
                  val seconds = totalSec % 60L
                  val centis = (safeMs % 1000L) / 10L
                  return if (hours > 0L) {
                      String.format(Locale.US, "%d:%02d:%02d.%02d", hours, minutes, seconds, centis)
                  } else {
                      String.format(Locale.US, "%02d:%02d.%02d", minutes, seconds, centis)
                  }
              }

              fun formatSignedSeconds(offsetMs: Long): String {
                  val seconds = offsetMs / 1000.0
                  val sign = if (offsetMs > 0) "+" else ""
                  return String.format(Locale.US, "%s%.2fs", sign, seconds)
              }

              fun formatFileSize(sizeBytes: Long): String {
                  if (sizeBytes <= 0L) return "0 B"
                  val kb = 1024.0
                  val mb = kb * 1024.0
                  val gb = mb * 1024.0
                  return when {
                      sizeBytes >= gb -> String.format(Locale.US, "%.2f GB", sizeBytes / gb)
                      sizeBytes >= mb -> String.format(Locale.US, "%.1f MB", sizeBytes / mb)
                      sizeBytes >= kb -> String.format(Locale.US, "%.0f KB", sizeBytes / kb)
                      else -> "$sizeBytes B"
                  }
              }

              fun computeResolutionBadge(width: Int, height: Int): String {
                  val maxDim = maxOf(width, height)
                  val minDim = minOf(width, height)
                  return when {
                      maxDim >= 7600 || minDim >= 4300 -> "8K"
                      maxDim >= 3800 || minDim >= 2100 -> "4K UHD"
                      maxDim >= 2500 || minDim >= 1400 -> "1440p QHD"
                      maxDim >= 1900 || minDim >= 1000 -> "1080p FHD"
                      maxDim >= 1200 || minDim >= 700 -> "720p HD"
                      maxDim >= 800 || minDim >= 480 -> "480p"
                      maxDim > 0 -> "${minDim}p"
                      else -> "VIDEO"
                  }
              }
          }
