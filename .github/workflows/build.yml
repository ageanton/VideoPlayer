                                      shape = RoundedCornerShape(12.dp),
                                      color = MaterialTheme.colorScheme.primaryContainer,
                                      modifier = Modifier.size(38.dp)
                                  ) {
                                      Box(contentAlignment = Alignment.Center) {
                                          Icon(
                                              Icons.Default.PlayArrow,
                                              contentDescription = null,
                                              tint = MaterialTheme.colorScheme.onPrimaryContainer
                                          )
                                      }
                                  }
                                  Spacer(Modifier.width(12.dp))
                              }

                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      text = if (selectedFolder != null) {
                                          File(selectedFolder!!).name.ifBlank { "Folder" }
                                      } else {
                                          "CINEPULSE PRO"
                                      },
                                      style = MaterialTheme.typography.headlineMedium,
                                      fontFamily = CineSansFontFamily,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                                  Text(
                                      text = if (selectedFolder != null) {
                                          val count = videos.count { it.folderPath == selectedFolder }
                                          "$count videos in folder"
                                      } else {
                                          "${videos.size} videos • ${folders.size} folders • ${prefs.defaultDecoderMode.badge} Engine"
                                      },
                                      style = MaterialTheme.typography.labelMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }

                              // Network Stream Hub Button
                              IconButton(onClick = { showNetworkSheet = true }) {
                                  Icon(
                                      Icons.Default.CloudQueue,
                                      contentDescription = "Network Stream",
                                      tint = MaterialTheme.colorScheme.primary
                                  )
                              }

                              // 30-Day Trash Bin Button with Badge
                              BadgedBox(
                                  badge = {
                                      if (trashedVideos.isNotEmpty()) {
                                          Badge { Text(trashedVideos.size.toString(), style = TabularNumeralStyle) }
                                      }
                                  }
                              ) {
                                  IconButton(onClick = { showTrashSheet = true }) {
                                      Icon(Icons.Outlined.RestoreFromTrash, contentDescription = "30-Day Trash Bin")
                                  }
                              }

                              // Sort Dropdown Trigger
                              Box {
                                  IconButton(onClick = { showSortMenu = true }) {
                                      Icon(Icons.Default.Sort, contentDescription = "Sort")
                                  }
                                  DropdownMenu(
                                      expanded = showSortMenu,
                                      onDismissRequest = { showSortMenu = false }
                                  ) {
                                      Text(
                                          "Sort Library By",
                                          style = MaterialTheme.typography.labelMedium,
                                          color = MaterialTheme.colorScheme.primary,
                                          modifier = Modifier.padding(horizontal = 16.dp, vertical = 6.dp)
                                      )
                                      LibrarySortField.entries.forEach { field ->
                                          DropdownMenuItem(
                                              text = { Text(field.label) },
                                              leadingIcon = {
                                                  if (prefs.sortField == field) {
                                                      Icon(
                                                          if (prefs.sortAscending) Icons.Default.ArrowUpward else Icons.Default.ArrowDownward,
                                                          contentDescription = null,
                                                          tint = MaterialTheme.colorScheme.primary
                                                      )
                                                  }
                                              },
                                              onClick = {
                                                  val nextAsc = if (prefs.sortField == field) !prefs.sortAscending else false
                                                  viewModel.setSortOption(field, nextAsc)
                                                  showSortMenu = false
                                              }
                                          )
                                      }
                                  }
                              }

                              // Settings & Theme Button
                              IconButton(onClick = { showSettingsSheet = true }) {
                                  Icon(Icons.Outlined.Settings, contentDescription = "Settings & Themes")
                              }
                          }

                          // Search Bar & 4 Instant View Mode Switcher Row
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 16.dp, vertical = 6.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              OutlinedTextField(
                                  value = searchQuery,
                                  onValueChange = { viewModel.setSearchQuery(it) },
                                  placeholder = { Text("Search videos, folders, 4K, MKV...", fontSize = 13.sp) },
                                  leadingIcon = { Icon(Icons.Default.Search, contentDescription = null, modifier = Modifier.size(18.dp)) },
                                  trailingIcon = {
                                      if (searchQuery.isNotEmpty()) {
                                          IconButton(onClick = { viewModel.setSearchQuery("") }) {
                                              Icon(Icons.Default.Clear, contentDescription = "Clear", modifier = Modifier.size(18.dp))
                                          }
                                      }
                                  },
                                  singleLine = true,
                                  shape = RoundedCornerShape(14.dp),
                                  modifier = Modifier
                                      .weight(1f)
                                      .height(48.dp),
                                  textStyle = MaterialTheme.typography.bodyMedium
                              )

                              Spacer(Modifier.width(8.dp))

                              // 4-Mode View Switcher Pill
                              Surface(
                                  shape = RoundedCornerShape(14.dp),
                                  color = MaterialTheme.colorScheme.surfaceVariant,
                                  modifier = Modifier.height(48.dp)
                              ) {
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      modifier = Modifier.padding(horizontal = 4.dp)
                                  ) {
                                      LibraryViewMode.entries.forEach { mode ->
                                          val selected = prefs.libraryViewMode == mode
                                          val icon = when (mode) {
                                              LibraryViewMode.FOLDER -> Icons.Outlined.Folder
                                              LibraryViewMode.RICH_LIST -> Icons.Outlined.ViewList
                                              LibraryViewMode.COMFORT_GRID -> Icons.Outlined.GridView
                                              LibraryViewMode.COMPACT_GRID -> Icons.Outlined.Apps
                                          }
                                          IconButton(
                                              onClick = {
                                                  viewModel.setViewMode(mode)
                                                  if (mode != LibraryViewMode.FOLDER && selectedFolder != null) {
                                                      // Keep folder filter if user wants, or allow browsing
                                                  }
                                              },
                                              modifier = Modifier
                                                  .size(38.dp)
                                                  .clip(RoundedCornerShape(10.dp))
                                                  .background(
                                                      if (selected) MaterialTheme.colorScheme.primary
                                                      else Color.Transparent
                                                  )
                                          ) {
                                              Icon(
                                                  icon,
                                                  contentDescription = mode.label,
                                                  tint = if (selected) MaterialTheme.colorScheme.onPrimary
                                                  else MaterialTheme.colorScheme.onSurfaceVariant,
                                                  modifier = Modifier.size(20.dp)
                                              )
                                          }
                                      }
                                  }
                              }
                          }

                          if (isScanning) {
                              LinearProgressIndicator(modifier = Modifier.fillMaxWidth().height(2.dp))
                          } else {
                              HorizontalDivider(color = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = 0.6f))
                          }
                      }
                  },
                  floatingActionButton = {
                      // Context-Aware Circular Resume FAB (Global on Root, Folder-Specific inside Folder)
                      resumeTarget?.let { targetVideo ->
                          Column(
                              horizontalAlignment = Alignment.End,
                              verticalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              AnimatedVisibility(
                                  visible = showFabPreviewTooltip,
                                  enter = fadeIn() + slideInVertically { it / 2 },
                                  exit = fadeOut() + slideOutVertically { it / 2 }
                              ) {
                                  Surface(
                                      shape = RoundedCornerShape(16.dp),
                                      color = MaterialTheme.colorScheme.inverseSurface,
                                      shadowElevation = 8.dp
                                  ) {
                                      Row(
                                          modifier = Modifier.padding(horizontal = 14.dp, vertical = 8.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Icon(
                                              Icons.Default.History,
                                              contentDescription = null,
                                              tint = MaterialTheme.colorScheme.inverseOnSurface,
                                              modifier = Modifier.size(16.dp)
                                          )
                                          Spacer(Modifier.width(6.dp))
                                          Text(
                                              text = "Resume: ${targetVideo.titleWithoutExt} • ${FormatUtils.formatDurationMs(targetVideo.savedPositionMs)}",
                                              style = TabularNumeralStyle,
                                              fontSize = 12.sp,
                                              color = MaterialTheme.colorScheme.inverseOnSurface,
                                              maxLines = 1
                                          )
                                      }
                                  }
                              }

                              Box(
                                  contentAlignment = Alignment.Center,
                                  modifier = Modifier
                                      .size(62.dp)
                                      .clip(CircleShape)
                                      .combinedClickable(
                                          onClick = { onPlayVideo(targetVideo, true) },
                                          onLongClick = { showFabPreviewTooltip = !showFabPreviewTooltip }
                                      )
                              ) {
                                  Surface(
                                      shape = CircleShape,
                                      color = MaterialTheme.colorScheme.primaryContainer,
                                      shadowElevation = 8.dp,
                                      modifier = Modifier.size(56.dp)
                                  ) {
                                      Box(contentAlignment = Alignment.Center) {
                                          Icon(
                                              Icons.Default.PlayArrow,
                                              contentDescription = "Context-Aware Smart Resume",
                                              tint = MaterialTheme.colorScheme.onPrimaryContainer,
                                              modifier = Modifier.size(28.dp)
                                          )
                                      }
                                  }
                                  CircularProgressIndicator(
                                      progress = { targetVideo.completionFraction.coerceIn(0.05f, 1f) },
                                      modifier = Modifier.size(60.dp),
                                      color = MaterialTheme.colorScheme.primary,
                                      trackColor = MaterialTheme.colorScheme.primary.copy(alpha = 0.2f),
                                      strokeWidth = 3.dp,
                                      strokeCap = StrokeCap.Round
                                  )
                              }
                          }
                      }
                  }
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                  ) {
                      if (!hasPermission) {
                          PermissionGrantCard(
                              onRequestPermission = { permissionLauncher.launch(requiredPermission) },
                              onOpenNetworkStream = { showNetworkSheet = true }
                          )
                      } else {
                          val displayedVideos = remember(videos, selectedFolder) {
                              if (selectedFolder != null) {
                                  videos.filter { it.folderPath == selectedFolder }
                              } else {
                                  videos
                              }
                          }

                          if (prefs.libraryViewMode == LibraryViewMode.FOLDER && selectedFolder == null && searchQuery.isBlank()) {
                              if (folders.isEmpty()) {
                                  EmptyLibraryView(
                                      onRefresh = { viewModel.refreshLibrary() },
                                      onOpenNetworkStream = { showNetworkSheet = true }
                                  )
                              } else {
                                  FolderGridView(
                                      folders = folders,
                                      imageLoader = videoImageLoader,
                                      onFolderClick = { folder -> viewModel.openFolder(folder.folderPath) },
                                      onResumeFolderVideo = { video -> onPlayVideo(video, true) }
                                  )
                              }
                          } else {
                              if (displayedVideos.isEmpty()) {
                                  EmptyLibraryView(
                                      onRefresh = { viewModel.refreshLibrary() },
                                      onOpenNetworkStream = { showNetworkSheet = true }
                                  )
                              } else {
                                  when (prefs.libraryViewMode) {
                                      LibraryViewMode.FOLDER, LibraryViewMode.RICH_LIST -> {
                                          RichVideoListView(
                                              videos = displayedVideos,
                                              imageLoader = videoImageLoader,
                                              onVideoClick = { onPlayVideo(it, true) },
                                              onRenameClick = { videoToRename = it },
                                              onTrashClick = { viewModel.moveVideoToTrash(it) }
                                          )
                                      }
                                      LibraryViewMode.COMFORT_GRID -> {
                                          ComfortVideoGridView(
                                              videos = displayedVideos,
                                              imageLoader = videoImageLoader,
                                              onVideoClick = { onPlayVideo(it, true) },
                                              onRenameClick = { videoToRename = it },
                                              onTrashClick = { viewModel.moveVideoToTrash(it) }
                                          )
                                      }
                                      LibraryViewMode.COMPACT_GRID -> {
                                          CompactVideoGridView(
                                              videos = displayedVideos,
                                              imageLoader = videoImageLoader,
                                              onVideoClick = { onPlayVideo(it, true) },
                                              onRenameClick = { videoToRename = it },
                                              onTrashClick = { viewModel.moveVideoToTrash(it) }
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              // In-Place Rename Dialog (Preserving SHA-256 Fingerprint State)
              videoToRename?.let { target ->
                  var newTitleText by remember(target) { mutableStateOf(target.titleWithoutExt) }
                  AlertDialog(
                      onDismissRequest = { videoToRename = null },
                      icon = { Icon(Icons.Default.DriveFileRenameOutline, contentDescription = null) },
                      title = { Text("Rename Video In-Place") },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text(
                                  "All bookmarks, saved A-B loops, and resume progress are linked to this file's SHA-256 content fingerprint and will be 100% preserved.",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                              OutlinedTextField(
                                  value = newTitleText,
                                  onValueChange = { newTitleText = it },
                                  label = { Text("New Title (without .${target.extensionBadge.lowercase()})") },
                                  singleLine = true,
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      },
                      confirmButton = {
                          Button(
                              onClick = {
                                  viewModel.renameVideo(target, newTitleText)
                                  videoToRename = null
                              }
                          ) {
                              Text("Rename")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { videoToRename = null }) {
                              Text("Cancel")
                          }
                      }
                  )
              }

              // 30-Day Recoverable Trash Bin Sheet
              if (showTrashSheet) {
                  TrashBinModalSheet(
                      trashedVideos = trashedVideos,
                      onRestore = { viewModel.restoreTrashedVideo(it) },
                      onDeleteForever = { viewModel.deleteTrashedVideoForever(it) },
                      onEmptyTrash = { viewModel.emptyEntireTrash() },
                      onDismiss = { showTrashSheet = false }
                  )
              }

              // Immaculate Network Stream Engine Sheet
              if (showNetworkSheet) {
                  NetworkStreamModalSheet(
                      streamHistory = networkStreams,
                      onLaunchStream = { url, title, ua, referer, headers ->
                          showNetworkSheet = false
                          viewModel.saveAndLaunchNetworkStream(url, title, ua, referer, headers) { streamItem ->
                              onPlayVideo(streamItem, true)
                          }
                      },
                      onDeleteHistory = { viewModel.deleteStreamHistoryItem(it) },
                      onDismiss = { showNetworkSheet = false }
                  )
              }

              // App-Wide Theme & Player Preferences Sheet
              if (showSettingsSheet) {
                  AppSettingsModalSheet(
                      prefs = prefs,
                      onThemeChange = { viewModel.setThemeMode(it) },
                      onDynamicColorsChange = { viewModel.setDynamicColors(it) },
                      onDecoderChange = { viewModel.setDefaultDecoder(it) },
                      onHoldSpeedChange = { viewModel.setHoldFastForwardSpeed(it) },
                      onDoubleTapSeekChange = { viewModel.setDoubleTapSeekSeconds(it) },
                      onAutoPipChange = { viewModel.setAutoPip(it) },
                      onBgAudioChange = { viewModel.setBackgroundAudio(it) },
                      onDismiss = { showSettingsSheet = false }
                  )
              }
          }

          // ============================================================================
          // 4. VIEW LAYOUT COMPONENTS (FOLDER, RICH LIST, COMFORT GRID, COMPACT GRID)
          // ============================================================================

          @Composable
          private fun FolderGridView(
              folders: List<VideoFolderItem>,
              imageLoader: ImageLoader,
              onFolderClick: (VideoFolderItem) -> Unit,
              onResumeFolderVideo: (LocalVideoItem) -> Unit
          ) {
              LazyVerticalGrid(
                  columns = GridCells.Adaptive(minSize = 172.dp),
                  contentPadding = PaddingValues(16.dp),
                  horizontalArrangement = Arrangement.spacedBy(14.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp),
                  modifier = Modifier.fillMaxSize()
              ) {
                  items(folders, key = { it.folderPath }) { folder ->
                      ElevatedCard(
                          shape = RoundedCornerShape(18.dp),
                          onClick = { onFolderClick(folder) },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              // 2x2 Thumbnail Grid Preview
                              Box(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .height(106.dp)
                                      .clip(RoundedCornerShape(12.dp))
                                      .background(MaterialTheme.colorScheme.surfaceVariant)
                              ) {
                                  val previewVideos = folder.videos.take(4)
                                  Column(modifier = Modifier.fillMaxSize()) {
                                      for (row in 0..1) {
                                          Row(modifier = Modifier.weight(1f).fillMaxWidth()) {
                                              for (col in 0..1) {
                                                  val idx = row * 2 + col
                                                  val vid = previewVideos.getOrNull(idx)
                                                  Box(
                                                      modifier = Modifier
                                                          .weight(1f)
                                                          .fillMaxHeight()
                                                          .padding(1.dp)
                                                  ) {
                                                      if (vid != null) {
                                                          AsyncImage(
                                                              model = ImageRequest.Builder(LocalContext.current)
                                                                  .data(vid.contentUri)
                                                                  .videoFrameMillis(2000L)
                                                                  .build(),
                                                              imageLoader = imageLoader,
                                                              contentDescription = null,
                                                              contentScale = ContentScale.Crop,
                                                              modifier = Modifier.fillMaxSize()
                                                          )
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }

                                  // Unplayed count pill
                                  if (folder.unplayedCount > 0) {
                                      Surface(
                                          shape = RoundedCornerShape(8.dp),
                                          color = MaterialTheme.colorScheme.primary,
                                          modifier = Modifier
                                              .align(Alignment.TopEnd)
                                              .padding(6.dp)
                                      ) {
                                          Text(
                                              text = "${folder.unplayedCount} NEW",
                                              style = TabularNumeralStyle,
                                              fontSize = 10.sp,
                                              fontWeight = FontWeight.Bold,
                                              color = MaterialTheme.colorScheme.onPrimary,
                                              modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp)
                                          )
                                      }
                                  }
                              }

                              Spacer(Modifier.height(10.dp))
                              Text(
                                  text = folder.folderName,
                                  style = MaterialTheme.typography.titleMedium,
                                  fontWeight = FontWeight.Bold,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                              Spacer(Modifier.height(2.dp))
                              Text(
                                  text = "${folder.videos.size} videos • ${FormatUtils.formatFileSize(folder.totalSizeBytes)}",
                                  style = TabularNumeralStyle,
                                  fontSize = 12.sp,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )

                              folder.lastPlayedVideo?.let { lastVid ->
                                  Spacer(Modifier.height(8.dp))
                                  FilledTonalButton(
                                      onClick = { onResumeFolderVideo(lastVid) },
                                      contentPadding = PaddingValues(horizontal = 10.dp, vertical = 4.dp),
                                      shape = RoundedCornerShape(10.dp),
                                      modifier = Modifier.fillMaxWidth().height(32.dp)
                                  ) {
                                      Icon(Icons.Default.PlayArrow, contentDescription = null, modifier = Modifier.size(15.dp))
                                      Spacer(Modifier.width(4.dp))
                                      Text(
                                          text = "Resume ${FormatUtils.formatDurationMs(lastVid.savedPositionMs)}",
                                          style = TabularNumeralStyle,
                                          fontSize = 11.sp,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun RichVideoListView(
              videos: List<LocalVideoItem>,
              imageLoader: ImageLoader,
              onVideoClick: (LocalVideoItem) -> Unit,
              onRenameClick: (LocalVideoItem) -> Unit,
              onTrashClick: (LocalVideoItem) -> Unit
          ) {
              LazyColumn(
                  contentPadding = PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp),
                  modifier = Modifier.fillMaxSize()
              ) {
                  items(videos, key = { it.fileFingerprint + it.filePath }) { video ->
                      var menuExpanded by remember { mutableStateOf(false) }
                      ElevatedCard(
                          shape = RoundedCornerShape(16.dp),
                          onClick = { onVideoClick(video) },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              // 140.dp x 78.dp (16:9) Rounded Thumbnail with Duration & 3.dp Progress Bar
                              Box(
                                  modifier = Modifier
                                      .size(width = 140.dp, height = 78.dp)
                                      .clip(RoundedCornerShape(12.dp))
                                      .background(MaterialTheme.colorScheme.surfaceVariant)
                              ) {
                                  AsyncImage(
                                      model = ImageRequest.Builder(LocalContext.current)
                                          .data(video.contentUri)
                                          .videoFrameMillis((video.durationMs / 4).coerceAtLeast(1000L))
                                          .build(),
                                      imageLoader = imageLoader,
                                      contentDescription = video.displayName,
                                      contentScale = ContentScale.Crop,
                                      modifier = Modifier.fillMaxSize()
                                  )

                                  // Bottom-right duration chip
                                  Surface(
                                      shape = RoundedCornerShape(6.dp),
                                      color = Color.Black.copy(alpha = 0.78f),
                                      modifier = Modifier
                                          .align(Alignment.BottomEnd)
                                          .padding(end = 6.dp, bottom = 6.dp)
                                  ) {
                                      Text(
                                          text = FormatUtils.formatDurationMs(video.durationMs),
                                          style = TabularMonoStyle,
                                          fontSize = 10.sp,
                                          color = Color.White,
                                          modifier = Modifier.padding(horizontal = 5.dp, vertical = 2.dp)
                                      )
                                  }

                                  // Bottom 3.dp resume progress bar
                                  if (video.savedPositionMs > 0L) {
                                      LinearProgressIndicator(
                                          progress = { video.completionFraction },
                                          modifier = Modifier
                                              .align(Alignment.BottomCenter)
                                              .fillMaxWidth()
                                              .height(3.dp),
                                          color = MaterialTheme.colorScheme.primary,
                                          trackColor = Color.White.copy(alpha = 0.25f)
                                      )
                                  }
                              }

                              Spacer(Modifier.width(12.dp))

                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      text = video.titleWithoutExt,
                                      style = MaterialTheme.typography.titleMedium,
                                      fontWeight = FontWeight.SemiBold,
                                      maxLines = 2,
                                      overflow = TextOverflow.Ellipsis
                                  )
                                  Spacer(Modifier.height(6.dp))

                                  // Spec Badges Row ([1080p FHD] [MKV] [1.4 GB] [CC])
                                  Row(
                                      horizontalArrangement = Arrangement.spacedBy(6.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      modifier = Modifier.horizontalScroll(rememberScrollState())
                                  ) {
                                      SpecBadgeChip(text = video.resolutionBadge, highlight = true)
                                      SpecBadgeChip(text = video.extensionBadge)
                                      SpecBadgeChip(text = FormatUtils.formatFileSize(video.sizeBytes))
                                      if (video.hasSidecarSubtitles) {
                                          SpecBadgeChip(text = "CC • ${video.sidecarSubtitleFiles.size}", highlight = true)
                                      }
                                  }

                                  if (video.savedPositionMs > 0L) {
                                      Spacer(Modifier.height(4.dp))
                                      Text(
                                          text = "Watched ${FormatUtils.formatDurationMs(video.savedPositionMs)} of ${FormatUtils.formatDurationMs(video.durationMs)}",
                                          style = TabularNumeralStyle,
                                          fontSize = 11.sp,
                                          color = MaterialTheme.colorScheme.primary
                                      )
                                  }
                              }

                              Box {
                                  IconButton(onClick = { menuExpanded = true }) {
                                      Icon(Icons.Default.MoreVert, contentDescription = "Video Actions")
                                  }
                                  DropdownMenu(
                                      expanded = menuExpanded,
                                      onDismissRequest = { menuExpanded = false }
                                  ) {
                                      DropdownMenuItem(
                                          text = { Text("Play from Beginning") },
                                          leadingIcon = { Icon(Icons.Default.Replay, contentDescription = null) },
                                          onClick = {
                                              menuExpanded = false
                                              onVideoClick(video.copy(savedPositionMs = 0L))
                                          }
                                      )
                                      DropdownMenuItem(
                                          text = { Text("Rename In-Place") },
                                          leadingIcon = { Icon(Icons.Default.DriveFileRenameOutline, contentDescription = null) },
                                          onClick = {
                                              menuExpanded = false
                                              onRenameClick(video)
                                          }
                                      )
                                      DropdownMenuItem(
                                          text = { Text("Move to 30-Day Trash") },
                                          leadingIcon = {
                                              Icon(
                                                  Icons.Outlined.Delete,
                                                  contentDescription = null,
                                                  tint = MaterialTheme.colorScheme.error
                                              )
                                          },
                                          onClick = {
                                              menuExpanded = false
                                              onTrashClick(video)
                                          }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ComfortVideoGridView(
              videos: List<LocalVideoItem>,
              imageLoader: ImageLoader,
              onVideoClick: (LocalVideoItem) -> Unit,
              onRenameClick: (LocalVideoItem) -> Unit,
              onTrashClick: (LocalVideoItem) -> Unit
          ) {
              LazyVerticalGrid(
                  columns = GridCells.Fixed(2),
                  contentPadding = PaddingValues(16.dp),
                  horizontalArrangement = Arrangement.spacedBy(12.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp),
                  modifier = Modifier.fillMaxSize()
              ) {
                  items(videos, key = { it.fileFingerprint + it.filePath }) { video ->
                      var menuExpanded by remember { mutableStateOf(false) }
                      ElevatedCard(
                          shape = RoundedCornerShape(16.dp),
                          onClick = { onVideoClick(video) }
                      ) {
                          Column {
                              Box(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .aspectRatio(16f / 9f)
                                      .background(MaterialTheme.colorScheme.surfaceVariant)
                              ) {
                                  AsyncImage(
                                      model = ImageRequest.Builder(LocalContext.current)
                                          .data(video.contentUri)
                                          .videoFrameMillis(2000L)
                                          .build(),
                                      imageLoader = imageLoader,
                                      contentDescription = video.displayName,
                                      contentScale = ContentScale.Crop,
                                      modifier = Modifier.fillMaxSize()
                                  )
                                  Surface(
                                      shape = RoundedCornerShape(6.dp),
                                      color = Color.Black.copy(alpha = 0.78f),
                                      modifier = Modifier
                                          .align(Alignment.BottomEnd)
                                          .padding(6.dp)
                                  ) {
                                      Text(
                                          text = FormatUtils.formatDurationMs(video.durationMs),
                                          style = TabularMonoStyle,
                                          fontSize = 10.sp,
                                          color = Color.White,
                                          modifier = Modifier.padding(horizontal = 5.dp, vertical = 2.dp)
                                      )
                                  }
                                  if (video.savedPositionMs > 0L) {
                                      LinearProgressIndicator(
                                          progress = { video.completionFraction },
                                          modifier = Modifier
                                              .align(Alignment.BottomCenter)
                                              .fillMaxWidth()
                                              .height(3.dp),
                                          color = MaterialTheme.colorScheme.primary,
                                          trackColor = Color.White.copy(alpha = 0.25f)
                                      )
                                  }
                              }
                              Row(
                                  modifier = Modifier.padding(10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(
                                          text = video.titleWithoutExt,
                                          style = MaterialTheme.typography.titleSmall,
                                          maxLines = 2,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                      Spacer(Modifier.height(4.dp))
                                      Text(
                                          text = "${video.resolutionBadge} • ${video.extensionBadge} • ${FormatUtils.formatFileSize(video.sizeBytes)}",
                                          style = TabularNumeralStyle,
                                          fontSize = 11.sp,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                                          maxLines = 1
                                      )
                                  }
                                  Box {
                                      IconButton(
                                          onClick = { menuExpanded = true },
                                          modifier = Modifier.size(28.dp)
                                      ) {
                                          Icon(Icons.Default.MoreVert, contentDescription = null, modifier = Modifier.size(18.dp))
                                      }
                                      DropdownMenu(expanded = menuExpanded, onDismissRequest = { menuExpanded = false }) {
                                          DropdownMenuItem(
                                              text = { Text("Rename") },
                                              onClick = { menuExpanded = false; onRenameClick(video) }
                                          )
                                          DropdownMenuItem(
                                              text = { Text("Move to Trash") },
                                              onClick = { menuExpanded = false; onTrashClick(video) }
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun CompactVideoGridView(
              videos: List<LocalVideoItem>,
              imageLoader: ImageLoader,
              onVideoClick: (LocalVideoItem) -> Unit,
              onRenameClick: (LocalVideoItem) -> Unit,
              onTrashClick: (LocalVideoItem) -> Unit
          ) {
              LazyVerticalGrid(
                  columns = GridCells.Fixed(3),
                  contentPadding = PaddingValues(12.dp),
                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                  verticalArrangement = Arrangement.spacedBy(8.dp),
