              ) {
                  items(videos, key = { it.fileFingerprint + it.filePath }) { video ->
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .aspectRatio(16f / 10f)
                              .clip(RoundedCornerShape(12.dp))
                              .background(MaterialTheme.colorScheme.surfaceVariant)
                              .combinedClickable(
                                  onClick = { onVideoClick(video) },
                                  onLongClick = { onRenameClick(video) }
